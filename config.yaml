# ============================================================================
# 内隐联想测验（IAT）中文版 · 实验配置
# ----------------------------------------------------------------------------
# 换实验内容只需要改这个文件，不用碰 run.py。
# 改完先跑：python run.py --check-only
# ============================================================================

experiment:
  name: IAT
  # 布局：
  #   greenwald7 标准七区块（190 试次，当前默认）——目标词先行，区块 5 用 30 试次
  #   nosek7     同上，但区块 5 用 40 试次（200 试次）
  #   cas7       中科院心理所七区块（180 试次）——属性词先行，与上面两种顺序相反
  #   greenwald5 Greenwald(1998) 五部分（140 试次）
  layout: greenwald7
  # 中文字体。auto = 按操作系统自动挑选（Windows 用微软雅黑）
  # 也可以直接写字体名，例如 "SimHei"
  font: auto

window:
  size: [1366, 768]      # 非全屏时的窗口尺寸
  fullscreen: true
  background: black

# 目标词与属性词用不同颜色，避免被试分不清该按类别还是按词义归类
# （Greenwald 等 2022，建议 A9。英文材料还能靠大小写区分，中文只能靠颜色或字体）
display:
  target_color: white        # 概念词，如 玫瑰、蟑螂
  attribute_color: lightgray # 属性词，如 喜爱、战争

keys:
  left: e
  right: i

timing:
  # 试次开始（类别标签出现）到刺激出现之间的间隔，秒。这一项即文献中的 ITI
  stim_delay: 0.3
  # 单个试次的作答时限，秒。0 = 不限时。是否必须答对才能继续，看下面的 error_handling
  rt_timeout: 0
  # 知情同意页的最短停留时间，秒。这段时间内按键无效，防止被试误触直接"同意"
  consent_min_time: 3.0
  # 每个区块说明页的最短停留时间，秒。防止连按导致说明页被瞬间跳过
  instruction_min_time: 1.5

# ----------------------------------------------------------------------------
# 答错时怎么处理
#   correct = 屏幕下方显示红 X，必须按对键才能继续（IAT 标准做法，
#             反应时记的是"改对之后"的时间）
#   advance = 不显示任何反馈，答错也直接进入下一试次
#             （计分时会给错误试次加 600ms 惩罚，见 score.py）
# default 是默认行为，下面可按区块号单独覆盖；区块号见 check.cmd 的输出
#
# 2022 年的最佳实践把「等到按对才记录反应时」列为首选做法（附录 A），
# 理由是内置的错误惩罚优于事后加毫秒（Greenwald, Nosek & Banaji, 2003）。
# 只有在软件无法等被试改对时才退回 advance。本程序能等，所以七个区块都设 correct。
# ----------------------------------------------------------------------------
error_handling:
  default: correct

# ----------------------------------------------------------------------------
# 计分参数。默认值 = Greenwald, Nosek & Banaji (2003) Table 4 的改进算法
# ----------------------------------------------------------------------------
scoring:
  rt_max: 10000          # 剔除慢于该值的试次（毫秒）
  fast_rt: 300           # 快于该值算"快速试次"
  fast_pct_limit: 0.10   # 快速试次比例超过 10% 就剔除该被试
  # 错误率剔除线。2003 原文把这一步列为可选，本版默认不做。
  # 若论文方法部分声明了按错误率剔除被试，填 0.10 或 0.20，否则代码不执行这一步。
  error_rate_exclude: null
  # 是否删除快于 400ms 的试次。true 对应原文的 D2/D6 变体
  delete_below_400: false
  # advance 模式下，错误试次替换为「该区块正确均值 + 这个惩罚」
  error_penalty: 600
  # 合并标准差用哪些试次：all = 全部试次（2022 附录 B 的标准做法）
  #                        correct = 只用正确试次（早期文献中的变体）
  sd_basis: all

# ----------------------------------------------------------------------------
# 属性词：全程固定在屏幕某一侧，不参与左右互换
#   side 必须是 left 或 right，且两个属性必须分居两侧
# ----------------------------------------------------------------------------
attributes:
  - name: 积极
    side: right
    exemplars: [喜爱, 和平, 愉快, 快乐, 拥抱]
  - name: 消极
    side: left
    exemplars: [痛苦, 憎恨, 战争, 丑恶, 死亡]

# ----------------------------------------------------------------------------
# 概念词：side 表示"正顺序（T 组）"下它所在的侧；
# 反顺序（F 组）时左右自动互换——这是配对顺序平衡的实现方式。
#
# 相容配对 = 概念词与同侧属性词构成的配对。
# 例如 花 与 积极 同在 right，则"花-积极"为相容，另一侧"虫-消极"也为相容。
# 校验规则：两个概念必须分居两侧；每个概念的 side 必须与某个属性相同。
# ----------------------------------------------------------------------------
concepts:
  - name: 花
    side: right
    exemplars: [玫瑰, 百合, 兰花, 荷花, 菊花]
  - name: 虫
    side: left
    exemplars: [蚊子, 蟑螂, 苍蝇, 蚂蚁, 飞蛾]

# ----------------------------------------------------------------------------
# 指导语。{L} {R} 会被替换成当前区块左右两侧的类别名，
# {KEY_L} {KEY_R} 会被替换成实际的按键字母。保留这些占位符。
# ----------------------------------------------------------------------------
instructions:
  # 七个说明页共用的正文。改这一处，七页同时生效。
  # 可用占位符：{L} {R} {KEY_L} {KEY_R} {ERROR_RULE} {COMMON} {SECTION}
  instruction_common: |
    词语会一个一个出现在屏幕中央。若属于左侧类别，按 {KEY_L} 键；属于右侧类别，按 {KEY_R} 键。

    {ERROR_RULE}

    请尽量又快又准。

    准备好后，按 {KEY_L} 键或 {KEY_R} 键开始。

  consent: |
    欢迎参加本次实验

    本实验是一个词语分类的计算机任务，采用内隐联想测验（IAT）范式，
    用来了解人们对不同类别词语的自动化联想。全程约 4—5 分钟。
    屏幕中央会逐个出现词语，请按每部分开始前说明的规则将其归到左侧或右侧。

    任务没有已知风险，也不会引起不适。参加完全自愿，
    您可在任何时候按 Esc 键退出，无需说明理由，不会产生任何不利影响。

    数据以编号形式匿名保存，不记录姓名、学号等可识别身份的信息，
    仅用于本研究统计分析，不对外公开。如有疑问请询问主试；
    完整研究信息及签字请见随后纸质知情同意书。

    按空格键表示您已阅读以上内容并自愿参加；按 Esc 键退出。

  b1: |
    初始目标词辨别

    屏幕上方左侧是「{L}」，右侧是「{R}」。

    {COMMON}

  b2: |
    属性词辨别

    屏幕上方左侧是「{L}」，右侧是「{R}」。

    {COMMON}

  b3: |
    初始联合辨别（练习）

    屏幕上方左侧是「{L}」，右侧是「{R}」。

    {COMMON}

  b4: |
    初始联合辨别（正式）

    屏幕上方左侧是「{L}」，右侧是「{R}」。

    {COMMON}

  b5: |
    相反目标词辨别

    请注意，左右两侧的目标词已经互换位置。

    现在屏幕上方左侧是「{L}」，右侧是「{R}」。

    {COMMON}

  b6: |
    相反联合辨别（练习）

    屏幕上方左侧是「{L}」，右侧是「{R}」。

    {COMMON}

  b7: |
    相反联合辨别（正式）

    屏幕上方左侧是「{L}」，右侧是「{R}」。

    {COMMON}

  thanks: |
    实验结束，感谢您的参与。

    请按任意键退出，并通知主试。
